version: "2"
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - ireturn
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - wrapcheck
    - wsl_v5
  settings:
    decorder:
      dec-order:
        - const
        - var
        - type
        - func
    errcheck:
      check-type-assertions: true
      check-blank: true
    errchkjson:
      check-error-free-encoding: true
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - style
        - performance
        - opinionated
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
    makezero:
      always: true
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    prealloc:
      simple: false
      for-loops: true
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: enforce-map-style
          arguments:
            - make
        - name: enforce-slice-style
          arguments:
            - make
        - name: function-length
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: unhandled-error
          disabled: true
    sloglint:
      no-global: default
      args-on-sep-lines: true
    staticcheck:
      checks:
        - all
    unparam:
      check-exported: true
    usestdlibvars:
      time-date-month: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true
    usetesting:
      os-temp-dir: true
      context-background: true
      context-todo: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - containedctx
          - err113
          - gochecknoglobals
          - gocognit
          - maintidx
          - nilerr
          - nonamedreturns
          - wrapcheck
        path: _test\.go
      - path: _test\.go
        text: fieldalignment
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
