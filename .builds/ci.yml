---
image: 'archlinux'
packages:
  - 'go'
  - 'make'
  - 'libvips'
  - 'libheif'
  - 'lcms2'
  - 'openjpeg2'
sources:
  - https://git.sr.ht/~jamesponddotco/imgdiet-go
tasks:
  - lint: |
      cd imgdiet-go
      export PATH="${HOME}/go/bin:${PATH}"
      make lint
  - test: |
      cd imgdiet-go
      make test
